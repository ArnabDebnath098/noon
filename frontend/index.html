<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=3" />
    <!-- Mobile-first: lock viewport to device width. viewport-fit=cover lets an
         INSTALLED (standalone) app run edge-to-edge like a native app — iOS
         letterboxes the bottom safe-area otherwise, and env() insets only ever
         report non-zero with it. In a regular browser tab iOS reports spurious
         bottom insets with cover (pushed-up sheets / gaps), so AppShell zeroes
         --sat/--sab there and only wires them to env() when standalone. The
         desktop device frame supplies its own faux insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- tints the mobile browser status bar to the app's top gradient blue -->
    <meta name="theme-color" content="#D4EFF6" />

    <!-- Add to Home Screen (iOS + Android) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="noon" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Figtree (marketplace experiment) + Questrial (landing screen) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Questrial&display=swap"
      rel="stylesheet"
    />

    <title>noon Experiments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
